[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systutor-oss"
version = "0.1.0"
description = "Core inicial de SYSTUTOR OSS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2.0",
  "psycopg>=3.1,<4.0",
  "redis>=5.0,<6.0",
  "dramatiq[redis]>=1.17,<2.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1.0",
  "ruff>=0.5.0",
]
termux-dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1.0",
]
dev-full = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "plugins*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/api/v1/core.py" = ["B008"]
"apps/api/app/api/v1/system.py" = ["B008"]
"apps/api/app/kernel/auth/dependencies.py" = ["B008"]
"apps/api/app/kernel/auth/router.py" = ["B008"]
"apps/api/migrations/env.py" = ["I001"]
"apps/api/migrations/versions/*.py" = ["I001"]

[tool.pyright]
include = ["apps/api/app", "apps/api/tests", "plugins", "packages"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
